name: Check and benchmark
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y fio jq shellcheck
      - name: Shell checks
        run: |
          shellcheck storagebench.sh tests/*.sh
          bash tests/cli.sh
      - name: Filesystem benchmark and failure cleanup
        run: bash tests/integration.sh
